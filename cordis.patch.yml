# dsh-mcp-server bundle: inserts the DSH MCP Server Host plugin.
#
# This fork intentionally does NOT insert the `dsh-work-sync` row. The upstream
# bundle registers task-start progress sync alongside the endpoint, which makes
# every session that begins a task ask up to three peer sessions "what are you
# working on". The engine and its service are still shipped (other rows may
# mount `dsh-mcp-btwy/work-sync` explicitly), they are simply not mounted here.
- insert:
    - id: dsh-mcp-server
      name: 'dsh-mcp-btwy'
      config: {}
