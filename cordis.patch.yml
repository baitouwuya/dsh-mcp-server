# dsh-mcp-server bundle: inserts the DSH MCP Server Host plugin, plus the
# task-start progress-sync row it reports on. They are separate rows so sync can
# be reloaded, disabled, or replaced without touching the endpoint.
- insert:
    - id: dsh-mcp-server
      name: 'dsh-mcp-btwy'
      config: {}
    - id: dsh-work-sync
      name: 'dsh-mcp-btwy/work-sync'
      config: {}
